name: Verborra
options:
  bundleIdPrefix: com.apeek
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

packages:
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: "0.4.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  swift-atomics:
    url: https://github.com/apple/swift-atomics.git
    from: "1.3.0"

targets:
  Verborra:
    type: application
    platform: macOS
    sources:
      - path: Verborra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apeek.Verborra
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Verborra/Info.plist
        CODE_SIGN_ENTITLEMENTS: Verborra/Verborra.entitlements
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_OBJC_BRIDGING_HEADER: Verborra/Verborra-Bridging-Header.h
    dependencies:
      - package: swift-markdown
        product: Markdown
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: swift-atomics
        product: Atomics

  VerborraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VerborraTests
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
    dependencies:
      - target: Verborra
